upstream campus_backend {
    server app1:8080;
    server app2:8080;
}
server {
    listen 80;
    location / {
        proxy_pass http://campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Campus-Upstream $upstream_addr always;
    }
}
