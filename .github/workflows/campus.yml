name: Campus Pickup CI and CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and real MySQL concurrency tests
        run: mvn -B clean verify

      - name: Validate single-server deployment configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-validation-root
          MYSQL_PASSWORD: ci-validation-database
          RABBITMQ_PASSWORD: ci-validation-rabbit
          JWT_SECRET: ci-validation-secret-at-least-32-characters
        run: |
          docker compose -f compose.server.yml config --quiet
          bash -n scripts/deploy_server.sh
          docker build --target runtime -t campus-pickup:runtime-check .

      - name: Build Docker runtime and launch two application instances
        run: |
          docker tag campus-pickup:runtime-check campus-pickup:local
          docker compose -f compose.campus.yml up -d --no-build

      - name: Two-instance API and cache broadcast smoke test
        run: python3 scripts/smoke_campus.py

      - name: Container logs
        if: failure()
        run: docker compose -f compose.campus.yml logs --no-color --tail 150

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: campus-jar
          path: target/dianping-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Stop isolated test containers
        if: always()
        run: docker compose -f compose.campus.yml down -v

  deploy:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.deploy))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: campus-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: campus-jar
          path: target

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Package and upload
        timeout-minutes: 12
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -s target/dianping-0.0.1-SNAPSHOT.jar
          mkdir -p "$RUNNER_TEMP/release/target" "$RUNNER_TEMP/release/docker/nginx" "$RUNNER_TEMP/release/scripts"
          cp Dockerfile .dockerignore compose.server.yml "$RUNNER_TEMP/release/"
          cp docker/nginx/server.conf "$RUNNER_TEMP/release/docker/nginx/"
          cp scripts/deploy_server.sh "$RUNNER_TEMP/release/scripts/"
          cp target/dianping-0.0.1-SNAPSHOT.jar "$RUNNER_TEMP/release/target/"
          tar -cf - -C "$RUNNER_TEMP/release" . | gzip -1 > "$RUNNER_TEMP/release.tgz"
          ls -lh "$RUNNER_TEMP/release.tgz"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" 'mkdir -p "$HOME/campus-deploy/incoming"'
          timeout 600 scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$RUNNER_TEMP/release.tgz" "$SERVER_USER@$SERVER_HOST:campus-deploy/incoming/$RELEASE_ID.tgz"

      - name: Deploy and check readiness
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SERVER_USER@$SERVER_HOST" bash -se -- "$RELEASE_ID" < scripts/deploy_server.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
