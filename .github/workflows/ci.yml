name: Dianping CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dianping-jar
          path: target/dianping-0.0.1-SNAPSHOT.jar

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dianping-jar

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dianping_deploy
          chmod 600 ~/.ssh/dianping_deploy
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Upload jar
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          scp -i ~/.ssh/dianping_deploy \
            dianping-0.0.1-SNAPSHOT.jar \
            "$ECS_USER@$ECS_HOST:/home/dodo/projects/dianping/target/dianping-new.jar"

      - name: Deploy application
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/dianping_deploy "$ECS_USER@$ECS_HOST" '
            set -e

            DEPLOY_DIR=/home/dodo/projects/dianping/target
            APP_JAR=$DEPLOY_DIR/dianping-0.0.1-SNAPSHOT.jar
            NEW_JAR=$DEPLOY_DIR/dianping-new.jar
            BACKUP_JAR=$DEPLOY_DIR/dianping-backup.jar

            cd "$DEPLOY_DIR"

            echo "Backing up current version..."
            cp "$APP_JAR" "$BACKUP_JAR"

            echo "Deploying new version..."
            mv "$NEW_JAR" "$APP_JAR"

            echo "Restarting application..."
            sudo -n /usr/bin/systemctl restart dianping
          '

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          echo "Waiting for application startup..."

          for i in {1..12}; do
            RESPONSE=$(curl -s https://api.chenjianai.xyz/actuator/health/liveness || true)

            echo "Attempt $i: $RESPONSE"

            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Health check failed."
          exit 1

      - name: Rollback
        if: steps.health.outcome == 'failure'
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/dianping_deploy "$ECS_USER@$ECS_HOST" '
            set -e

            DEPLOY_DIR=/home/dodo/projects/dianping/target
            APP_JAR=$DEPLOY_DIR/dianping-0.0.1-SNAPSHOT.jar
            BACKUP_JAR=$DEPLOY_DIR/dianping-backup.jar

            echo "Health check failed. Rolling back..."

            cp "$BACKUP_JAR" "$APP_JAR"

            sudo -n /usr/bin/systemctl restart dianping

            echo "Rollback completed."
          '

          echo "Deployment failed and rollback was triggered."
          exit 1
